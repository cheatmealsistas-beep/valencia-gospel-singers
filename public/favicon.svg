<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Gradiente púrpura-rosa para el centro (efecto esfera 3D) -->
    <radialGradient id="sphere-gradient" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#F0ABFC"/>
      <stop offset="30%" stop-color="#E879F7"/>
      <stop offset="55%" stop-color="#A855F7"/>
      <stop offset="80%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </radialGradient>

    <!-- Glow púrpura-rosa para el borde -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradiente para el borde -->
    <linearGradient id="border-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Brillo interno de la esfera -->
    <radialGradient id="shine" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Path circular para el texto -->
    <path id="text-arc" d="M 24 24 m -16, 0 a 16,16 0 1,1 32,0" fill="none"/>
  </defs>

  <!-- Disco vinilo (fondo oscuro) -->
  <circle cx="24" cy="24" r="22" fill="#0a0a0a"/>

  <!-- Borde fino con glow púrpura-rosa -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="url(#border-gradient)" stroke-width="0.8" filter="url(#glow)"/>

  <!-- Surcos sutiles del vinilo -->
  <circle cx="24" cy="24" r="18" fill="none" stroke="#1a1a1a" stroke-width="0.3"/>
  <circle cx="24" cy="24" r="15" fill="none" stroke="#1a1a1a" stroke-width="0.3"/>
  <circle cx="24" cy="24" r="12" fill="none" stroke="#1a1a1a" stroke-width="0.3"/>

  <!-- Texto en arco con fuente handwriting/script -->
  <text fill="#888" font-family="'Brush Script MT', 'Segoe Script', 'Bradley Hand', cursive" font-size="3.5" letter-spacing="0.1">
    <textPath href="#text-arc" startOffset="10%">
      Mediterránea Gospel Singers
    </textPath>
  </text>

  <!-- Centro esférico con gradiente púrpura-rosa -->
  <circle cx="24" cy="24" r="8" fill="url(#sphere-gradient)"/>

  <!-- Brillo en la esfera (efecto 3D) -->
  <ellipse cx="22" cy="21" rx="4" ry="3" fill="url(#shine)"/>

  <!-- Agujero central pequeño -->
  <circle cx="24" cy="24" r="1.5" fill="#0a0a0a"/>
</svg>

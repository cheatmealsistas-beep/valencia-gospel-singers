<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <radialGradient id="sphere" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#F0ABFC"/>
      <stop offset="40%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </radialGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Disco vinilo -->
  <circle cx="16" cy="16" r="15" fill="#0a0a0a"/>
  <circle cx="16" cy="16" r="15" fill="none" stroke="url(#border)" stroke-width="0.5" filter="url(#glow)"/>

  <!-- Surcos -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#222" stroke-width="0.3"/>
  <circle cx="16" cy="16" r="8" fill="none" stroke="#222" stroke-width="0.3"/>

  <!-- Centro esférico -->
  <circle cx="16" cy="16" r="5" fill="url(#sphere)"/>

  <!-- Agujero central -->
  <circle cx="16" cy="16" r="1" fill="#0a0a0a"/>
</svg>
